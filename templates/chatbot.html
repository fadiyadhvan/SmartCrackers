<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartCrackers AI Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .chat-container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        .chat-box {
            min-height: 150px;
            background: #f1f1f1;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .user {
            font-weight: bold;
        }

        .bot {
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">🏠 Home</a>

        <a href="/products">🎆 Products</a>

        <a href="/recommendation">
            🤖 AI Recommendation
        </a>

        <a href="/chatbot">
            💬 AI Chatbot
        </a>

        <a href="/cart">
            🛒 Cart
        </a>

        <a href="/orders">
            📦 My Orders
        </a>

    </div>


    <div class="chat-container">

        <h1>
            🤖 SmartCrackers AI Chatbot
        </h1>


        <div class="chat-box">

            {% if message %}

                <p class="user">
                    👤 You: {{ message }}
                </p>

            {% endif %}


            {% if response %}

                <p class="bot">
                    🤖 AI: {{ response }}
                </p>

            {% else %}

                <p>
                    👋 Hello! Ask me about products,
                    prices, budget, orders or Diwali.
                </p>

            {% endif %}

        </div>


        <form method="POST">

            <input
                type="text"
                name="message"
                placeholder="Ask something..."
                required
            >

            <button type="submit">
                💬 Send
            </button>

        </form>

    </div>

</body>

</html>
