<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thank You - SmartCrackers</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎆 SmartCrackers
    </div>

    <div class="nav-links">

        <a href="/">🏠 Home</a>

        <a href="/products">🎆 Products</a>

        <a href="/orders">📦 My Orders</a>

    </div>

</nav>


<!-- THANK YOU -->

<div class="container">

    <div class="product-card">

        <h1 class="title">
            🎉 Thank You!
        </h1>

        <h2>
            Your order has been placed successfully.
        </h2>

        <p>
            ❤️ Thank you for shopping with SmartCrackers!
        </p>

        <p>
            <strong>Order ID:</strong>
            {{ order_id }}
        </p>

        <p>
            <strong>Total Amount:</strong>
            ₹{{ total }}
        </p>

        <p>
            <strong>Status:</strong>
            ✅ Confirmed
        </p>

        <br>

        <a href="/products">
            <button class="btn">
                🎆 Continue Shopping
            </button>
        </a>

        <br>
        <br>

        <a href="/orders">
            <button class="btn">
                📦 View My Orders
            </button>
        </a>

        <br>
        <br>

        <a href="/">
            <button class="btn">
                🏠 Back to Home
            </button>
        </a>

    </div>

</div>

</body>

</html>
