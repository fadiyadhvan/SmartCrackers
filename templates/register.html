<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartCrackers Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar">

    <div class="logo">
        🎆 SmartCrackers
    </div>

    <div class="nav-links">

        <a href="/">
            🏠 Home
        </a>

        <a href="/products">
            🎆 Products
        </a>

        <a href="/recommendation">
            🤖 AI Recommendation
        </a>

        <a href="/cart">
            🛒 Cart
        </a>

        <a href="/register">
            📝 Register
        </a>

    </div>

</nav>


<!-- =========================
     REGISTRATION FORM
========================= -->

<div class="container">

    <h1 class="title">
        📝 Create Your Account
    </h1>


    <div class="product-card">


        <form action="/register" method="POST">


            <p>
                <strong>Full Name</strong>
            </p>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <p>
                <strong>Email</strong>
            </p>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <p>
                <strong>Mobile Number</strong>
            </p>

            <input
                type="tel"
                name="phone"
                placeholder="Enter mobile number"
                required
            >


            <p>
                <strong>Password</strong>
            </p>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <br>
            <br>


            <button
                type="submit"
                class="btn"
            >

                📝 Register

            </button>


        </form>


        <br>


        <p>
            Already have an account?
        </p>

        <a href="/login">

            <button class="btn">
                🔐 Login
            </button>

        </a>


    </div>

</div>


</body>

</html>
